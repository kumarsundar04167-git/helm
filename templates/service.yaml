apiVersion: v1
kind: Service
metadata:
  name: nginx
  # servicer labels
  labels:
    project: roboshop
    tier: frontend
    component: frontend
    purpose: Deployment
spec:
  type: {{ .values.service.type }}
  # Service uses the below labels to select the pods
  selector:
    project: roboshop
    tier: frontend
    component: frontend
    purpose: Deployment
  ports:
    - protocol: TCP
      port: 80 # service port
      targetPort: 80 # container port