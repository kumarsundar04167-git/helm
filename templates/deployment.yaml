apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    project: roboshop
    tier: frontend
    component: frontend
    purpose: Deployment
spec:
  # modify replicas according to your case
  replicas: {{ .values.deployment.replicas }}
  # replicaset uses these labels to match pods
  selector:
    matchLabels:
      project: roboshop
      tier: frontend
      component: frontend
      purpose: Deployment
  # pod definition
  template:
    metadata:
      labels:
        project: roboshop
        tier: frontend
        component: frontend
        purpose: Deployment
    spec:
      containers:
      - name: nginx
      image: nginx:{{ .values.deployment.imageversion }}
      ports:
       - containerport: 80

